name: Update Profile README

on:
  # Daily scheduled update at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

  # Run automatically whenever scripts or workflow files are updated
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile-readme.yml'

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: true

jobs:
  update-readme:
    name: Generate & Sync README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to ensure clean commit and push
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Updated README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update_readme.js

      - name: Verify Git Status and Commit Changes
        run: |
          # Check if README.md was modified by the generator
          if [ -n "$(git status --porcelain README.md)" ]; then
            echo "Changes detected in README.md. Committing and pushing updates..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update profile README [skip ci]"
            git push
            echo "✅ Successfully pushed updated profile README."
          else
            echo "✅ README.md is already up to date. No commit necessary."
          fi
